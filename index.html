<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Student Study Assistant</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f9ff;
      color: #1e293b;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      padding: 22px 8%;
      border-bottom: 2px solid #bae6fd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h2 {
      color: #0369a1;
    }

    .hero {
      text-align: center;
      padding: 55px 20px 30px;
    }

    .hero h1 {
      color: #075985;
      font-size: clamp(28px, 5vw, 42px);
      margin-bottom: 15px;
    }

    .hero p {
      color: #475569;
      font-size: 17px;
      line-height: 1.7;
    }

    .container {
      max-width: 850px;
      margin: 20px auto 60px;
      padding: 25px;
      background: #ffffff;
      border: 1px solid #bae6fd;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.10);
    }

    label {
      display: block;
      color: #075985;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    textarea, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #7dd3fc;
      border-radius: 10px;
      background: #ffffff;
      color: #1e293b;
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    textarea:focus, select:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px #e0f2fe;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    button {
      padding: 13px 16px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0369a1;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      background: #e0f2fe;
      color: #075985;
      border: 1px solid #7dd3fc;
    }

    .secondary:hover {
      background: #bae6fd;
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 12px;
      min-height: 100px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .result h3 {
      color: #0369a1;
      margin-bottom: 10px;
    }

    .status {
      margin-top: 15px;
      color: #0369a1;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <header>
    <h2>🎓 AI Study Assistant</h2>
    <span>Learn Smarter 💙</span>
  </header>

  <section class="hero">
    <h1>Your Personal AI Study Assistant</h1>
    <p>
      Understand your notes easily, find important points,<br>
      and practise with quizzes.
    </p>
  </section>

  <main class="container">
    <label for="topic">Study Topic</label>
    <select id="topic">
      <option value="summary">📝 Summarize Notes</option>
      <option value="important">⭐ Important Points</option>
      <option value="quiz">❓ Generate Quiz</option>
    </select>

    <label for="notes">Paste Your Notes Here</label>
    <textarea id="notes" placeholder="Paste your study notes here..."></textarea>

    <div class="buttons">
      <button id="generateBtn" onclick="generateResult()">
        Generate
      </button>
      <button class="secondary" onclick="clearAll()">
        Clear
      </button>
    </div>

    <div class="result" id="result">
      <h3>Your Result</h3>
      Your study result will appear here.
    </div>

    <p class="status" id="status"></p>
  </main>

  <footer>
    Made with 💙 for students
  </footer>

  <script>
    async function generateResult() {
      const notes = document.getElementById("notes").value.trim();
      const topic = document.getElementById("topic").value;
      const result = document.getElementById("result");
      const status = document.getElementById("status");
      const button = document.getElementById("generateBtn");

      if (!notes) {
        status.textContent = "Please paste your study notes first.";
        return;
      }

      result.textContent = "";
      status.textContent =
        "This HTML page needs a backend AI service to generate results.";
      button.disabled = true;

      try {
        const response = await fetch("/api/study", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ notes, topic })
        });

        if (!response.ok) {
          throw new Error("AI backend is not connected to this website yet.");
        }

        const data = await response.json();
        result.textContent = data.result || "No result returned.";
        status.textContent = "Completed successfully!";
      } catch (error) {
        status.textContent =
          "The design works, but AI generation needs a connected backend. " +
          "Your Python Gradio app currently runs separately.";
      } finally {
        button.disabled = false;
      }
    }

    function clearAll() {
      document.getElementById("notes").value = "";
      document.getElementById("result").textContent =
        "Your study result will appear here.";
      document.getElementById("status").textContent = "";
      document.getElementById("topic").selectedIndex = 0;
    }
  </script>
</body>
</html>
```
